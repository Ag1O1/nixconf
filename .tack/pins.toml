# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = "nixpkgs"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"

[inputs.nixpkgs-stable]
url = "github:NixOS/nixpkgs/nixos-26.05"

[inputs.finix]
url = "github:Ag1O1/finix"

[inputs.community-modules]
url = "github:finix-community/community-modules"

[inputs.haumea]
url = "github:nix-community/haumea"

[inputs.preservation]
url = "github:nix-community/preservation"

[inputs.hjem]
url = "github:feel-co/hjem"

[inputs.nvf]
url = "github:notashelf/nvf"

[inputs.umbriel]
url = "git+https://github.com/noctalia-dev/umbriel"

[inputs.xdg-desktop-portal-umbriel]
url = "github:noctalia-dev/xdg-desktop-portal-umbriel"

[inputs.noctalia]
url = "github:noctalia-dev/noctalia-shell"

[inputs.nix-cachyos-kernel]
url = "github:xddxdd/nix-cachyos-kernel/879f45ee15a3b06fdbbf9b6dc825c5fbca137fcd"

[inputs.wrapper-modules]
url = "github:BirdeeHub/nix-wrapper-modules"

[inputs.helium-flake]
url = "github:oxcl/nix-flake-helium-browser"

[inputs.millennium]
url = "github:SteamClientHomebrew/Millennium/a3d675611b68c5658a0b5ffd25b9f1b57c6d32ff"
dir = "packages/nix"
